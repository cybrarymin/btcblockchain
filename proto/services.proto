syntax = "proto3";
package chain;
option go_package = "protogen/pb";
import "proto/types/account.proto";
import "proto/types/accountBalance.proto";
import "proto/types/transaction.proto";
import "proto/types/block.proto";


service AccountService {
    rpc CreateAccount (CreateAccountReq) returns (CreateAccountResp);
    rpc AccountBalance (AccountBalanceReq) returns (AccountBalanceResp);
}

service TransactionService {
    rpc SignTransaction(TxSignReq) returns (TxSignRes);
    rpc SendTransaction(TxSendReq) returns (TxSendRes);
}

service BlockService {
    rpc SearchBlock(SearchBlockReq) returns(stream SearchBlockRes);
}